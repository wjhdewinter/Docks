<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5f00">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AWC Live Dockbord</title>
<link rel="icon" href="https://www.amsterdamwarehouse.com/assets/img/logo_AWC_black.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--orange:#ff5f00;--black:#0b0b0b;--panel:#171717;--panel2:#222;--line:#343434;--text:#fff;--muted:#b8b8b8;--free:#272727;--blue:#2563eb;--teal:#0f766e;--purple:#7c3aed;--amber:#d97706;--green:#16803d;--red:#b91c1c}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080808;color:var(--text);font-family:Arial,Helvetica,sans-serif}body{padding:0;display:flex;flex-direction:column;overflow:hidden;min-height:100dvh}
header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 16px;background:#fff;color:#111;border-bottom:4px solid var(--orange)}
.brand{display:flex;align-items:center;gap:14px;min-width:0}.brand img{width:138px;max-height:46px;object-fit:contain;object-position:left center}.title{min-width:0}.title h1{margin:0;font-size:clamp(20px,2vw,34px);line-height:1;font-weight:900;letter-spacing:.02em;white-space:nowrap}.title small{display:block;margin-top:5px;color:#4b4b4b;font-weight:800;letter-spacing:.15em;font-size:clamp(8px,.7vw,12px)}
.headright{text-align:right;white-space:nowrap}.clock{font-size:clamp(20px,1.9vw,32px);font-weight:900}.date{margin-top:2px;color:#555;font-size:clamp(9px,.75vw,13px)}
.summary{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:8px 12px;background:#0e0e0e}.summary .card{background:#171717;border:1px solid #2c2c2c;border-radius:9px;padding:6px 10px;min-width:0}.summary b{display:block;font-size:clamp(20px,1.9vw,32px);line-height:1;color:var(--orange)}.summary span{display:block;margin-top:3px;color:#c3c3c3;font-size:clamp(8px,.72vw,12px);font-weight:800;white-space:nowrap}
.board{flex:1 1 auto;min-height:0;padding:8px 12px}.grid{height:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));gap:7px}.dock{position:relative;min-width:0;min-height:0;border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:8px 9px 7px 13px;overflow:hidden;background:var(--free);display:flex;flex-direction:column}.dock:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:#555}.dock.free:before{background:#555}.dock.registered{background:#13255d}.dock.registered:before{background:var(--blue)}.dock.atdock{background:#103b39}.dock.atdock:before{background:var(--teal)}.dock.progress{background:#30205a}.dock.progress:before{background:var(--purple)}.dock.waiting{background:#542d09}.dock.waiting:before{background:var(--amber)}.dock.ready{background:#123b21}.dock.ready:before{background:var(--green)}.dock.urgent{box-shadow:inset 0 0 0 3px #ef4444}.dock.urgent:after{content:"SPOED";position:absolute;right:-28px;top:13px;background:#ef4444;color:#fff;font-weight:900;font-size:10px;padding:4px 30px;transform:rotate(36deg)}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:5px;min-width:0}.dname{font-size:clamp(15px,1.15vw,22px);line-height:1.05;font-weight:900;white-space:nowrap}.status{flex:0 0 auto;font-size:clamp(7px,.58vw,10px);line-height:1;font-weight:900;letter-spacing:.03em;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.14);padding:4px 6px;border-radius:999px;white-space:nowrap}.free .status{color:#d4d4d4}.ref{margin-top:7px;font-size:clamp(14px,1.05vw,20px);line-height:1.08;font-weight:900;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.meta{margin-top:5px;color:#e8e8e8;font-size:clamp(9px,.7vw,12.5px);line-height:1.25;min-width:0;overflow-wrap:anywhere}.meta .activity{display:block;font-weight:900}.meta .presence{display:block;margin-top:3px;white-space:nowrap}.meta .carrier{display:block;margin-top:3px;white-space:normal;overflow-wrap:anywhere}.empty{margin-top:10px;color:#b0b0b0;font-size:clamp(11px,.82vw,14px);font-weight:800}
.footer{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 12px 6px;color:#8f8f8f;font-size:10px;min-height:22px}.fsbtn{position:fixed;right:12px;bottom:12px;z-index:15;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.78);color:#fff;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.fsbtn.hidden{display:none}.live{display:flex;align-items:center;gap:6px;white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}.live.ok .dot{background:#22c55e}.live.bad .dot{background:#ef4444}
.auth{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(140deg,#101010,#1f1f1f);z-index:20;padding:20px}.auth.hidden{display:none}.login{width:min(430px,100%);background:#fff;color:#111;border-radius:16px;padding:24px;border-top:7px solid var(--orange)}.login img{width:180px;max-width:65%;display:block;margin-bottom:18px}.login h2{margin:0 0 6px;font-size:24px}.login p{margin:0 0 18px;color:#666;font-size:13px;line-height:1.45}.login input{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;margin:0 0 10px;font:inherit}.login button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--orange);color:#fff;font:inherit;font-weight:900;cursor:pointer}.msg{min-height:18px;margin-top:10px;color:#666;font-size:12px}.msg.err{color:#a61b12}

/* Grote/liggende monitor: 6 kolommen x 4 rijen, alle 22 docks zonder scroll */
@media (orientation:landscape){.grid{grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr))}}

/* Staand scherm/tablet: 4 kolommen x 6 rijen. Tekst blijft volledig leesbaar. */
@media (orientation:portrait){
 header{padding:8px 10px;gap:8px}.brand{gap:8px}.brand img{width:92px;max-height:38px}.title h1{font-size:clamp(18px,3vw,28px)}.title small{display:none}.clock{font-size:clamp(18px,3vw,28px)}.date{font-size:clamp(8px,1.35vw,11px)}
 .summary{gap:5px;padding:6px 8px}.summary .card{padding:5px 7px}.summary b{font-size:clamp(18px,3vw,28px)}.summary span{font-size:clamp(7px,1.25vw,10px)}
 .board{padding:6px 7px}.grid{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr));gap:5px}
 .dock{padding:6px 6px 5px 10px;border-radius:8px}.dock:before{width:4px}.dhead{gap:3px}.dname{font-size:clamp(13px,2.05vw,18px)}.status{font-size:clamp(6px,1.15vw,9px);padding:3px 4px}.ref{margin-top:5px;font-size:clamp(12px,1.9vw,17px);line-height:1.05}.meta{margin-top:3px;font-size:clamp(8px,1.42vw,11px);line-height:1.16}.meta .presence,.meta .carrier{margin-top:2px}.empty{margin-top:7px;font-size:clamp(9px,1.55vw,12px)}.footer{padding:2px 8px 4px;font-size:8px;min-height:18px}
}

/* Smalle telefoons: nog steeds 4 kolommen, extra compact zodat docknaam/status niet breken. */
@media (orientation:portrait) and (max-width:700px){
 .brand img{width:76px}.title h1{font-size:17px}.clock{font-size:17px}.date{font-size:7.5px}
 .summary b{font-size:19px}.summary span{font-size:7px}
 .dock{padding-left:8px;padding-right:4px}.dname{font-size:12px}.status{font-size:6px;padding:3px}.ref{font-size:11px}.meta{font-size:7.6px}.empty{font-size:9px}
}

/* Zeer brede schermen houden kaarten groot en goed leesbaar. */
@media (min-width:1600px) and (orientation:landscape){.board{padding:10px 14px}.grid{gap:9px}.dock{padding:10px 11px 9px 15px}.dname{font-size:22px}.ref{font-size:20px}.meta{font-size:13px}.status{font-size:10px}}
</style>
</head>
<body>
<div id="auth" class="auth"><div class="login"><img src="https://www.amsterdamwarehouse.com/assets/img/logo_AWC_black.svg" alt="Amsterdam Warehouse Company"><h2>Live Dockbord</h2><p>Log één keer in. Daarna blijft dit scherm alleen het actuele dockoverzicht tonen en automatisch synchroniseren.</p><input id="email" type="email" autocomplete="email" placeholder="E-mailadres"><input id="password" type="password" autocomplete="current-password" placeholder="Wachtwoord"><button id="loginBtn">Live bord openen</button><div id="msg" class="msg"></div></div></div>
<header><div class="brand"><img src="https://www.amsterdamwarehouse.com/assets/img/logo_AWC_black.svg" alt="AWC"><div class="title"><h1>LIVE DOCKBORD</h1><small>THE PLACE TO GO</small></div></div><div class="headright"><div id="clock" class="clock">--:--</div><div id="date" class="date"></div></div></header>
<section class="summary"><div class="card"><b id="freeCount">22</b><span>VRIJE DOCKS</span></div><div class="card"><b id="busyCount">0</b><span>BEZETTE DOCKS</span></div><div class="card"><b id="waitCount">0</b><span>WACHT</span></div><div class="card"><b id="readyCount">0</b><span>GEREED</span></div></section>
<main class="board"><div id="grid" class="grid"></div></main>
<footer class="footer"><div id="liveState" class="live"><span class="dot"></span><span id="liveText">Verbinden…</span></div><div>Amsterdam Warehouse Company · Dock 1 t/m 22</div></footer>
<button id="fsBtn" class="fsbtn" type="button">Volledig scherm</button>
<script>
const SUPABASE_URL='https://ghhcnzjdzmuupigspppl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable__tat43V0qbu_yu3lKiIFaA_w0nseD02';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let session=null,channel=null,jobs=[];
async function goFullscreen(){try{if(!document.fullscreenElement&&document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen({navigationUI:'hide'});}catch(e){console.warn('Fullscreen niet beschikbaar',e)}updateFullscreenButton()}
function updateFullscreenButton(){const b=$('fsBtn');if(!b)return;b.classList.toggle('hidden',!!document.fullscreenElement)}
document.addEventListener('fullscreenchange',updateFullscreenButton);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDuration(ts){if(!ts)return'-';let ms=Date.now()-new Date(ts).getTime();if(ms<0)ms=0;let min=Math.floor(ms/60000),d=Math.floor(min/1440);min%=1440;let h=Math.floor(min/60),m=min%60;return `${d?d+'d ':''}${h?h+'u ':''}${m}m`}
function statusClass(s){return {'Aangemeld':'registered','Aan dock':'atdock','Bezig':'progress','Wacht':'waiting','Gereed':'ready'}[s]||'progress'}
function setLive(type,text){$('liveState').className='live '+type;$('liveText').textContent=text}
function updateClock(){let d=new Date();$('clock').textContent=d.toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('date').textContent=d.toLocaleDateString('nl-NL',{weekday:'long',day:'2-digit',month:'long',year:'numeric'})}
function render(){let active=jobs.filter(j=>!j.departed),busy=new Set(active.map(j=>j.dock));$('busyCount').textContent=busy.size;$('freeCount').textContent=Math.max(0,22-busy.size);$('waitCount').textContent=active.filter(j=>j.status==='Wacht').length;$('readyCount').textContent=active.filter(j=>j.status==='Gereed').length;let g=$('grid');g.innerHTML='';for(let i=1;i<=22;i++){let name='Dock '+i,j=active.find(x=>x.dock===name),el=document.createElement('section');if(!j){el.className='dock free';el.innerHTML=`<div class="dhead"><div class="dname">${name}</div><div class="status">VRIJ</div></div><div class="empty">Beschikbaar</div>`}else{el.className='dock '+statusClass(j.status)+(j.priority==='spoed'?' urgent':'');el.innerHTML=`<div class="dhead"><div class="dname">${name}</div><div class="status">${esc(String(j.status||'').toUpperCase())}</div></div><div class="ref">${esc(j.reference)}</div><div class="meta"><span class="activity">${esc(j.activity||'')}${j.unit?' · '+esc(j.unit):''}</span><span class="presence">Aanwezig: <b>${esc(fmtDuration(j.arrived))}</b></span>${j.carrier||j.plate?`<span class="carrier">${j.carrier?esc(j.carrier):''}${j.carrier&&j.plate?' · ':''}${j.plate?esc(j.plate):''}</span>`:''}</div>`}g.appendChild(el)}}
async function allowed(){let email=(session?.user?.email||'').toLowerCase();if(!email)return false;const {data,error}=await db.from('awc_app_members').select('email,active').eq('email',email).maybeSingle();return !error&&!!data&&data.active}
async function refresh(){if(!session)return;setLive('','Synchroniseren…');const {data,error}=await db.from('awc_dock_registrations').select('*').order('arrived',{ascending:true});if(error){console.error(error);setLive('bad','Geen live verbinding');return}jobs=data||[];render();setLive('ok','Live gesynchroniseerd')}
async function startRealtime(){if(channel)await db.removeChannel(channel);channel=db.channel('awc-monitor-live').on('postgres_changes',{event:'*',schema:'public',table:'awc_dock_registrations'},()=>refresh()).subscribe(s=>{if(s==='SUBSCRIBED')setLive('ok','Live gesynchroniseerd')})}
async function enter(){if(!(await allowed())){$('msg').className='msg err';$('msg').textContent='Dit account heeft geen toegang tot de Dockregistratie.';return}$('auth').classList.add('hidden');await refresh();await startRealtime()}
$('loginBtn').addEventListener('click',async()=>{goFullscreen();let email=$('email').value.trim(),password=$('password').value,msg=$('msg');if(!email||!password){msg.className='msg err';msg.textContent='Vul e-mailadres en wachtwoord in.';return}msg.className='msg';msg.textContent='Inloggen…';const {data,error}=await db.auth.signInWithPassword({email,password});if(error){msg.className='msg err';msg.textContent='Inloggen is niet gelukt. Controleer e-mailadres en wachtwoord.';return}session=data.session;msg.textContent='';await enter()});
$('fsBtn').addEventListener('click',goFullscreen);
async function init(){updateClock();updateFullscreenButton();setInterval(updateClock,1000);setInterval(()=>render(),60000);const {data:{session:s}}=await db.auth.getSession();session=s;if(session)await enter();else setLive('bad','Niet ingelogd');db.auth.onAuthStateChange((_event,sess)=>{session=sess;if(!sess){$('auth').classList.remove('hidden');setLive('bad','Niet ingelogd')}})}
init();
</script>
</body>
</html>
